# config.conf - configuracao de balanceamento de um ambiente
#
# Para criar um novo ambiente:
#   1. Crie a pasta configs/<nome-do-ambiente>/
#   2. Copie este arquivo para configs/<nome-do-ambiente>/config.conf
#   3. Preencha os valores abaixo com os dados reais desse ambiente
#
# Depois disso, rode:
#   ./balance.sh <nome-do-ambiente> <caminho-do-csv>
#
# Formato: bash KEY=VALUE, lido via "source" pelo balance.sh.

# MAX_CLIENTS_PER_SERVER (obrigatorio)
#
# Numero maximo de clientes que qualquer servidor deste ambiente pode
# ter. Um servidor com mais clientes que esse valor e' considerado
# "excedente": o balanceamento vai mover clientes dele ate ele voltar
# exatamente a esse limite - nunca menos que isso, nunca tentando
# equilibrar os servidores entre si alem do necessario.
#
# Precisa ser um numero inteiro. Vale igualmente para todo servidor
# deste ambiente (exceto o RECEIVER_SERVER, que fica de fora).
MAX_CLIENTS_PER_SERVER=

# EXCLUDED_SERVERS (opcional)
#
# Lista de servidores deste ambiente que NAO devem receber clientes
# novos durante o balanceamento. Um servidor excluido AINDA PODE
# PERDER clientes normalmente se estiver acima do limite - a exclusao
# vale so para o lado de destino (nunca e' escolhido para receber
# alguem vindo de outro servidor).
#
# Separe varios nomes por virgula, sem espacos. Deixe em branco ("")
# se nenhum servidor deste ambiente tiver essa restricao.
#
# Exemplo: EXCLUDED_SERVERS="srvA,srvB"
EXCLUDED_SERVERS=""

# RECEIVER_SERVER (obrigatorio)
#
# Nome do unico servidor reservado para receber clientes novos
# automaticamente (fora deste script, por outro processo de
# provisionamento). Esse servidor fica COMPLETAMENTE fora do
# balanceamento: nunca perde nem recebe clientes por aqui, mesmo que
# ja tenha clientes na planilha e mesmo que esses clientes ultrapassem
# o MAX_CLIENTS_PER_SERVER ou o MAX_DEVICES_PER_SERVER.
RECEIVER_SERVER=

# MAX_DEVICES_PER_SERVER (opcional)
#
# Numero maximo de devices (somando todos os clientes) que qualquer
# servidor deste ambiente pode ter. Funciona junto com
# MAX_CLIENTS_PER_SERVER: um servidor fica "excedente" se ultrapassar
# QUALQUER um dos dois limites.
#
# Quando o excesso e' causado pelo limite de devices, o balanceamento
# move os clientes MAIORES primeiro (minimiza o numero de
# movimentacoes necessarias pra reduzir o total de devices). Quando o
# excesso e' so de contagem de clientes, continua movendo os menores
# primeiro, como sempre.
#
# Um servidor de destino so recebe um cliente se tiver folga tanto em
# vagas de cliente quanto em devices suficientes para aquele cliente
# especifico.
#
# Deixe em branco ou remova a linha se este ambiente nao tiver um
# limite de devices por servidor (o balanceamento passa a considerar
# so a contagem de clientes, como antes desta opcao existir). Se
# preenchido, precisa ser um numero inteiro.
MAX_DEVICES_PER_SERVER=
